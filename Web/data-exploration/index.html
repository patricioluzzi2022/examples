<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Chart.js Example</title>
    
    <link rel="stylesheet" href="assets/css/main-style.css">

</head>
<body>

    <div class="wizard-soperpower-9">
        <input type="text" id="data-socket-url" value="http://localhost:5000" />
        <button id="connect-socket-btn">Connect</button>
        <button id="disconnect-socket-btn">Disconnect</button>
    </div>

    <canvas id="GChart"  width="800" height="400"></canvas>

    <div class="chart-main-info">
        <div class="chart-info" id="max-freq">Max Frequency: 0</div>
        <div class="chart-info" id="min-freq">Min Frequency: 0</div>

        <div class="chart-info chart-info-freq-6" id="chart-info-freq-6">[ Mi/E2 - 82.41 Hz ]: </div>
        <div class="chart-info chart-info-freq-5" id="chart-info-freq-5">[ La/A2 - 110 Hz ]: </div>
        <div class="chart-info chart-info-freq-4" id="chart-info-freq-4">[ Re/D3 - 146.83 Hz ]: </div>
        <div class="chart-info chart-info-freq-3" id="chart-info-freq-3">[ Sol/G3 - 196 Hz ]: </div>
        <div class="chart-info chart-info-freq-2" id="chart-info-freq-2">[ Si/B3 - 246.94 Hz ]: </div>
        <div class="chart-info chart-info-freq-1" id="chart-info-freq-1">[ Mi/E4 - 329.63 Hz ]: </div>

    </div>

    <canvas id="chart-freq-6"  width="700" height="250"></canvas>
    <canvas id="chart-freq-5"  width="700" height="250"></canvas>
    <canvas id="chart-freq-4"  width="700" height="250"></canvas>
    <canvas id="chart-freq-3"  width="700" height="250"></canvas>
    <canvas id="chart-freq-2"  width="700" height="250"></canvas>
    <canvas id="chart-freq-1"  width="700" height="250"></canvas>

    <!--<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>-->

    <!--<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>-->

    <!--<script src="https://unpkg.com/rxjs@^7/dist/bundles/rxjs.umd.min.js"></script>-->

    <script src="assets/js/socketio.js"></script>

    <!--<script src="assets/js/rxjs.js"></script>-->

    <script src="assets/js/chart.js"></script>

    <script type="module" src="assets/js/main-module.js"></script>

</body>
</html>
