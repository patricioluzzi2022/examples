<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>data-graph</title>
    
    <link rel="stylesheet" href="assets/css/main-style.css">
    <link rel="stylesheet" href="assets/css/footer.css">

</head>
<body class="body-display">
    <div class="wizard-soperpower-9 wizard-soperpower-7" data-chart="1">
        <div class="graph-row-1">
            <div class="graph-col-0">
                Socket url: <input class="form-control-url" type="text" id="data-socket-url" value="http://localhost:36388" />
            </div>

            <div class="graph-col-1">
                
            </div>

            <div class="graph-col-2">
                Idle: <input class="form-control-idle-time" type="text" id="data-socket-idle-time" value="" placeholder="1500" /> [ms]
            </div>

            <div class="graph-col-3">
                <button id="connect-socket-control">Connect</button>
            </div>

            <div class="graph-col-4">
                <button id="disconnect-socket-control" class="control_disabled">Pause</button>
            </div>

            <div class="graph-col-5">
                <button id="clear-graph-control" class="control_disabled">Clear</button>
            </div>

            <div class="graph-col-6">
                <button id="add-new-graph-control">Add new graph</button>
            </div>
            
        </div>

        <div class="graph-row-2">
            <div class="graph-row-col-1">
                <canvas id="chart-1" class="canva-chart" data-chart="1"></canvas>
            </div>

            <div class="graph-row-col-2">
                <div class="nc-container">
                    <div class="nc-toolbar">
                        <button id="nc-toolbar-control-script" class="nc-toolbar-control control_disabled">Script</button>
                        <button id="nc-toolbar-control-bash-viewer" class="nc-toolbar-control control_disabled">Bash Viewer</button>
                    </div>

                    <div class="mc-container mc-bash">
                        
                    </div>
                    
                </div>
            </div>

            
        </div>
    </div>

    <div class="wizard-footer-105">
        By Norbert Storm Thomson & Alex Darias - Wizard Inside Reference
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

    <script type="module" src="assets/js/main-module.js"></script>

    <script type="module" src="assets/js/toolbar/toolbar.js"></script>

</body>
</html>
